<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#55745d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="念诵记" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
    <title>念诵记</title>
  </head>
  <body>
    <main class="app-shell">
      <header>
        <p class="eyebrow">个人念诵计数器</p>
        <h1>念诵记</h1>
        <p class="subtitle">安住当下，如实记录。</p>
      </header>

      <section class="card entry-card" aria-labelledby="entry-title">
        <h2 id="entry-title">记一笔</h2>
        <form id="entry-form">
          <label>
            经典名称
            <input id="sutra" name="sutra" list="sutra-options" placeholder="例如：心经" autocomplete="off" required />
            <datalist id="sutra-options"></datalist>
          </label>
          <div class="form-row">
            <label>
              日期
              <input id="date" name="date" type="date" required />
            </label>
            <label>
              次数
              <input id="count" name="count" type="number" min="1" step="1" value="1" inputmode="numeric" required />
            </label>
          </div>
          <button class="primary" type="submit">记录次数</button>
          <p id="form-note" class="form-note" aria-live="polite"></p>
        </form>
      </section>

      <section class="section-heading">
        <div>
          <p class="eyebrow">所有日期累计</p>
          <h2>经典总计</h2>
        </div>
        <p id="overall-total" class="overall-total">0 次</p>
      </section>
      <section id="summary-list" class="summary-list" aria-live="polite"></section>

      <section class="section-heading history-heading">
        <div>
          <p class="eyebrow">按日期保存</p>
          <h2>记录明细</h2>
        </div>
        <button id="clear-all" class="text-button danger" type="button">清空全部</button>
      </section>
      <section id="history-list" class="history-list" aria-live="polite"></section>

      <section class="card backup-card">
        <h2>备份与迁移</h2>
        <p>数据只保存在本机。用导出文件在 Mac、iPhone 和 iPad 之间转移记录。</p>
        <div class="backup-actions">
          <button id="export-data" class="secondary" type="button">导出备份</button>
          <label class="secondary file-button">导入备份<input id="import-data" type="file" accept="application/json" /></label>
        </div>
      </section>
    </main>
    <dialog id="edit-dialog">
      <form id="edit-form" method="dialog">
        <h2>修改记录</h2>
        <input id="edit-id" type="hidden" />
        <label>经典名称<input id="edit-sutra" required /></label>
        <div class="form-row">
          <label>日期<input id="edit-date" type="date" required /></label>
          <label>次数<input id="edit-count" type="number" min="1" step="1" required /></label>
        </div>
        <div class="dialog-actions"><button id="cancel-edit" class="secondary" value="cancel">取消</button><button class="primary" value="default">保存</button></div>
      </form>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
